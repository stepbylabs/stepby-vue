# Stepby 前端 Nginx 配置
# 作用：托管 SPA 静态资源 + 反向代理 API(生产前缀 /prod-api)、WebSocket(/ws)、上传(/uploads) 到后端。
# 说明：
#   - 上游后端固定指向 compose 中的 backend 服务（见 deploy/docker-compose.prod.yml）。
#   - K8s 部署时由 Helm Chart 以 ConfigMap 覆写本文件（templates/configmap-nginx.yaml），
#     上游域名改为真实的后端 Service（{{ include "stepby.backendName" . }}）。镜像内默认文件仅服务于本地 compose。
#   - 同源部署：前端请求 baseURL=/prod-api，浏览器只访问 Nginx 一个来源，无需跨域。
upstream stepby_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 访问日志（便于排障；生产可按需关闭）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- 压缩（构建产物含静态 .gz/.br，直接吐预压缩文件，减 CPU）----
    gzip on;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_static on;          # 命中同名 .gz 直接返回
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;

    # ---- sourcemap 防泄露（R102-SMAP-002/004 配套）----
    # 生产构建开启 hidden sourcemap（.map 随产物落盘、供错误堆栈离线还原
    # scripts/decode-stack.mjs 使用），但 JS 内无 sourceMappingURL 注释、浏览器
    # 不会自动拉取；此处再兜底拒绝对外提供 *.map（fail-closed），源码不暴露给访客。
    location ~* \.map$ {
        deny all;
        add_header Cache-Control "no-store";
    }

    # ---- SPA 入口 HTML（禁止长缓存）----
    # index.html 引用**带 hash** 的产物名：若入口 HTML 被浏览器启发式长缓存，用户会在旧页面里
    # 继续请求旧 hash 的包，导致"已发新版本但用户看不到"（R102-CACHE-001）。故入口一律 `no-cache`：
    # 允许缓存但每次**必须回源校验**（nginx 默认带 ETag/Last-Modified ⇒ 未变更时 304，开销极小）。
    # 说明：`location /` 的 `try_files ... /index.html` 属**内部重定向**，会重新走本 location，故同样生效。
    location = /index.html {
        # 只用 add_header（不再叠加 `expires -1`）——后者会再注入一条 `Cache-Control: no-cache`，
        # 造成同响应两条 Cache-Control 头（语义虽等价但易误读）。
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ---- 静态资源长缓存（带 hash 的文件名永不变化）----
    # 注意：Vite 的 `build.rollupOptions.output.{chunk,entry,asset}FileNames` 已把产物
    # 统一输出到 `static/js|css|...`（见 vite.config.ts），**不是** Vite 默认的 `assets/`。
    # 这里必须匹配 `static`，否则规则永不命中：带 hash 的 JS/CSS 会退化为无 Cache-Control
    # 的普通响应（浏览器启发式缓存），既无法享受 immutable 长缓存，也易出现旧包残留。
    # 同时保留 `assets/` 兜底（若后续改回 Vite 默认 assetsDir 仍生效）。
    location ~* ^/(static|assets)/ {
        # 单条 Cache-Control（不再叠加 `expires 1y`）——后者会再注入 `Cache-Control: max-age=31536000`，
        # 同一响应出现两条 Cache-Control（浏览器虽会合并，但策略读起来有歧义）。此处一条写全。
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- API 反向代理（后端已 nest /prod-api，保留路径转发）----
    location /prod-api/ {
        proxy_pass http://stepby_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ---- WebSocket（实时通知 /ws）----
    location /ws {
        proxy_pass http://stepby_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 上传目录（local 存储后端，头像附件等）----
    location /uploads/ {
        proxy_pass http://stepby_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 健康检查 ----
    location = /health {
        proxy_pass http://stepby_backend/health;
    }

    # ---- Swagger（可选）----
    location ~ ^/swagger-ui {
        proxy_pass http://stepby_backend;
        proxy_set_header Host $host;
    }

    # ---- SPA fallback（history 路由）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- PWA Service Worker（P3-23）----
    # sw.js / registerSW.js / workbox-*.js / manifest.webmanifest 均禁用浏览器与 CDN 长缓存，
    # 确保 SW 更新能被浏览器及时重新拉取，否则旧 SW 长期存活会导致应用停留在旧缓存版本。
    # Service-Worker-Allowed 头用于把 SW 作用域扩展至根路径（默认 deployment 在根路径时非必需，
    # 若后续改到子路径部署（如 /admin/），此头可保证 SW 仍能拦截 /admin/ 下所有请求）。
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        # 单条 Cache-Control（不再叠加 `expires -1`）——后者会再注入一条 `Cache-Control: no-cache`，
        # 同响应两条头虽语义等价但易误读；HTTP/1.0 兜底改由显式 `Expires: 0`（已过期）承担。
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        add_header Expires "0";
        try_files $uri =404;
    }
}