# Yebot 前端 Nginx 配置
# 作用：托管 SPA 静态资源 + 反向代理 API(生产前缀 /prod-api)、WebSocket(/ws)、上传(/uploads) 到后端。
# 说明：
#   - 上游后端固定指向 compose 中的 backend 服务（见 deploy/docker-compose.prod.yml）。
#   - K8s 部署时由 Helm Chart 以 ConfigMap 覆写本文件（templates/configmap-nginx.yaml），
#     上游域名改为真实的后端 Service（{{ include "yebot.backendName" . }}）。镜像内默认文件仅服务于本地 compose。
#   - 同源部署：前端请求 baseURL=/prod-api，浏览器只访问 Nginx 一个来源，无需跨域。
upstream yebot_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 访问日志（便于排障；生产可按需关闭）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- 压缩（构建产物含静态 .gz/.br，直接吐预压缩文件，减 CPU）----
    gzip on;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_static on;          # 命中同名 .gz 直接返回
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;

    # ---- 静态资源长缓存（带 hash 的文件名永不变化）----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API 反向代理（后端已 nest /prod-api，保留路径转发）----
    location /prod-api/ {
        proxy_pass http://yebot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ---- WebSocket（实时通知 /ws）----
    location /ws {
        proxy_pass http://yebot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 上传目录（local 存储后端，头像附件等）----
    location /uploads/ {
        proxy_pass http://yebot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 健康检查 ----
    location = /health {
        proxy_pass http://yebot_backend/health;
    }

    # ---- Swagger（可选）----
    location ~ ^/swagger-ui {
        proxy_pass http://yebot_backend;
        proxy_set_header Host $host;
    }

    # ---- SPA fallback（history 路由）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- PWA Service Worker（P3-23）----
    # sw.js / registerSW.js / workbox-*.js / manifest.webmanifest 均禁用浏览器与 CDN 长缓存，
    # 确保 SW 更新能被浏览器及时重新拉取，否则旧 SW 长期存活会导致应用停留在旧缓存版本。
    # Service-Worker-Allowed 头用于把 SW 作用域扩展至根路径（默认 deployment 在根路径时非必需，
    # 若后续改到子路径部署（如 /admin/），此头可保证 SW 仍能拦截 /admin/ 下所有请求）。
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        expires -1;
        try_files $uri =404;
    }
}