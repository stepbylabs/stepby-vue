# Dependabot 依赖自动更新（批六十二：机制性防漏洞债复发）
#
# 说明：
# - npm 周更 PR 会触发 CI 全绿门禁后才可合并（typecheck/lint/vitest/build/perf-budget）
# - 传递依赖漏洞由 pnpm-workspace.yaml overrides + 定期 lockfile 升级管理
#   （brace-expansion 维护版与 minimatch 不兼容的实证教训见 pnpm-workspace.yaml 注释）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - ci
