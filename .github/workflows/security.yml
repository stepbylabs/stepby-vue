# Stepby Vue Security Scan（单仓版）
#
# 作用：
#   1. pnpm-audit  —— 前端 npm 依赖已知漏洞（audit-level=high）
#   2. gitleaks    —— 全仓库密钥/凭证泄露扫描
#
# 触发：push/PR 到 main、每周一 03:00 UTC 定时全量扫描。
# 权限：contents: read 最小权限；两个 job 并行互不阻断。

name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    name: 前端依赖漏洞扫描 (pnpm-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # 口径：--prod 聚焦运行时依赖面（浏览器产物实际携带的依赖树）。
        # devDependencies（构建工具链 postcss/svgo/glob 等）不进产物，其漏洞
        # 由 pnpm-workspace.yaml overrides + 定期 lockfile 升级管理；
        # 生产树 high 已于 2026-10-12 清零（vue 3.5.43 + patch 级 overrides）。
        run: pnpm --registry=https://registry.npmjs.org audit --prod --audit-level=high

  gitleaks:
    name: 密钥泄露扫描 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # zricethezdev/gitleaks-action 已迁移至 gitleaks org（旧仓库 404，run 38275496005 实证）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
