# Stepby Vue Security Scan（单仓版）
#
# 作用：
#   1. pnpm-audit  —— 前端 npm 依赖已知漏洞（audit-level=high）
#   2. gitleaks    —— 全仓库密钥/凭证泄露扫描
#
# 触发：push/PR 到 main、每周一 03:00 UTC 定时全量扫描。
# 权限：contents: read 最小权限；两个 job 并行互不阻断。

name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    name: 前端依赖漏洞扫描 (pnpm-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        # 口径：--prod 聚焦运行时依赖面（浏览器产物实际携带的依赖树）。
        # devDependencies（构建工具链 postcss/svgo/glob 等）不进产物，其漏洞
        # 由 pnpm-workspace.yaml overrides + 定期 lockfile 升级管理；
        # 生产树 high 已于 2026-10-12 清零（vue 3.5.43 + patch 级 overrides）。
        run: pnpm --registry=https://registry.npmjs.org audit --prod --audit-level=high

  gitleaks:
    name: 密钥泄露扫描 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 直装官方 CLI（gitleaks/gitleaks 非 action 仓、gitleaks-action 对 org 仓收费——
      # run 38284804232/38278563759 实证），版本钉死保证可复现
      - name: Install gitleaks (official binary, pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (full history secret scan)
        run: gitleaks detect --source . --redact -v --exit-code 1
