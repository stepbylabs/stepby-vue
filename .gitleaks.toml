# gitleaks 自定义配置（批六十一）：扩展默认规则 + 全局 allowlist。
# 误报经逐条定性：i18nKey 是菜单国际化键字段（translateTitle 参数名），非任何凭据；
# 用 regex 豁免（而非 file:line 指纹）以免疫行号漂移（历史 commit 行号 71/73 不一致实证）。
# 注：generic-api-key 的 match 为捕获的赋值右侧值本身，故按值锚定。
[extend]
useDefault = true

[allowlist]
description = "批六一定性豁免：菜单 i18nKey 误报（非凭据）"
regexTarget = "match"
regexes = [
  '''^scope\.row\.i18nKey$''',
  '''i18nKey:\s*scope\.row\.i18nKey''',
  # 历史 commit（RuoYi 上游默认测试密钥对，公开知识、当前版本已移除；非保密凭据）
  '''MIIBVAIBADANBgkqhkiG9w0BAQ''',
  '''MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKoR8mX0''',
  '''MIGfMA0GCSqGSIb3''',
  # 批六十四循环轮 13 定性豁免：e2e 本地 SCIM 测试凭据（仅本机测试环境有效——
  # .env 的 SCIM_ENABLED 只在本机开启；生产凭据走环境变量注入不入库，
  # main.mjs 已改为 process.env.SCIM_BEARER_TOKEN 读取，此处豁免的是历史 commit 7e7ba10）
  '''e2e_scim_bearer_[0-9a-f]+''',
]
